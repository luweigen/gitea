<!DOCTYPE html>
<!-- Older Gitea file editor layout: a plain tabular tab menu, no
     .repo-editor-menu and no .code-editor-options. The Insert drawing button
     has to fall back to the tab menu as its anchor. -->
<html data-theme="gitea-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>markdown-draw harness -- file editor (older layout)</title>
<link rel="stylesheet" href="/css/gitea-draw.css">
<link rel="stylesheet" href="/fileeditor.css">
<script>window.giteaDrawConfig = {assetsPrefix: '/js-draw', ...(window.__cfgOverride || {})};</script>
<script src="/js/gitea-draw.js" defer></script>
<script src="/js/gitea-draw-history.js" defer></script>
<script src="/js/gitea-draw-playback.js" defer></script>
</head>
<body>
<form class="ui edit form form-fetch-action" method="post" action="#">
  <div class="repo-editor-header">
    <div class="breadcrumb">
      <input id="file-name" maxlength="255" value="Draw.md" required>
    </div>
  </div>
  <div class="ui top attached tabular menu">
    <a class="active item" data-tab="write">Edit file</a>
    <a class="item" data-tab="preview">Preview</a>
  </div>
  <div class="ui active tab" data-tab="write">
    <textarea id="edit_area" name="content" class="tw-hidden"
      data-previewable-extensions=".md,.markdown,.csv,.org"></textarea>
    <div class="editor-loading is-loading"></div>
  </div>
  <div class="ui tab markup" data-tab="preview" id="filepreview"></div>
</form>

<script src="/monaco/min/vs/loader.js"></script>
<script src="/harness.js"></script>
<script src="/fileeditor.js"></script>
</body>
</html>
